<style>
  :root{
    --ink:#334d66;
    --charcoal:#595757;
    --accent-light:#93c4d3;
    --brand-navy:#215f9a;
    --brand-mid:#7ab6c8;
    --support:#5580ab;
    --hazard:#8f7aa8;
    --safety:#e5711f;
    --success:#7fae27;
    --surface:#ffffff;
    --surface-alt:#f6f7f8;
    --border:#e4e7ea;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(51,77,102,.06), 0 8px 24px -12px rgba(51,77,102,.18);
    --shadow-float:0 10px 30px -8px rgba(51,77,102,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--charcoal);background:#dfe7ec;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Poppins',system-ui,sans-serif;}
  button{font-family:inherit;}
  input,textarea{font-family:inherit;font-size:16px;}

  #app-frame{max-width:480px;margin:0 auto;min-height:100vh;background:var(--surface-alt);position:relative;display:flex;flex-direction:column;overflow:hidden;}
  @media (min-width:560px){
    body{display:flex;justify-content:center;padding:28px 0;}
    #app-frame{min-height:calc(100vh - 56px);height:860px;border-radius:32px;box-shadow:var(--shadow-float);border:1px solid rgba(51,77,102,.08);}
  }

  /* ---------- Login screen ---------- */
  #view-login{position:absolute;inset:0;z-index:40;background:var(--accent-light);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center;}
  #view-login.hidden{display:none;}
  #view-login img{width:min(70%,260px);margin-bottom:8px;}
  #view-login .tagline{font-family:'Caveat',cursive;font-weight:700;font-size:22px;color:var(--brand-navy);margin-bottom:30px;}
  #view-login input{width:100%;border:none;border-radius:999px;padding:14px 18px;margin-bottom:12px;background:rgba(255,255,255,.9);color:var(--ink);}
  #view-login input::placeholder{color:var(--charcoal);}
  #login-error{color:#b23b3b;font-size:13px;min-height:18px;margin-bottom:4px;}
  .login-btn{width:100%;background:var(--brand-navy);color:#fff;border:none;border-radius:999px;padding:14px;font-family:'Caveat',cursive;font-weight:700;font-size:21px;cursor:pointer;margin-top:8px;}
  .login-btn:disabled{opacity:.6;}
  .login-hint{font-size:12px;color:var(--brand-navy);opacity:.8;margin-top:18px;line-height:1.5;}

  /* ---------- Header ---------- */
  header{background:var(--accent-light);padding:20px 18px 16px;flex-shrink:0;position:relative;z-index:5;text-align:center;}
  .brand-row{display:flex;align-items:center;justify-content:center;position:relative;}
  .brand-row img{height:44px;display:block;}
  .signout-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;}
  .org-name{font-family:'Caveat',cursive;font-weight:700;font-size:17px;color:var(--brand-navy);margin-top:2px;}
  .stat-row{display:flex;justify-content:center;gap:30px;margin-top:8px;}
  .stat-row .stat-num{font-family:'Caveat',cursive;font-weight:700;font-size:28px;line-height:1;color:var(--brand-navy);}
  .stat-row .stat-label{font-family:'Caveat',cursive;font-weight:700;font-size:17px;color:var(--brand-navy);}

  /* ---------- View container ---------- */
  main{flex:1;position:relative;overflow:hidden;}
  .view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .view.active{display:block;}

  /* ---------- Browse view ---------- */
  #view-browse{overflow:hidden;}
  #map-el{position:absolute;inset:0;}
  .map-toggle{position:absolute;left:16px;right:16px;top:14px;z-index:4;display:flex;background:var(--accent-light);border-radius:999px;padding:4px;box-shadow:var(--shadow-card);}
  .map-toggle button{flex:1;border:none;background:none;padding:9px;border-radius:999px;font-family:'Caveat',cursive;font-weight:700;font-size:17px;color:#fff;cursor:pointer;}
  .map-toggle button.active{background:var(--brand-navy);}
  #browse-list{position:absolute;inset:0;top:62px;overflow-y:auto;padding:0 16px 100px;display:none;}
  #browse-list.active{display:block;}

  .legend{position:absolute;left:16px;right:16px;bottom:78px;z-index:4;background:var(--accent-light);border-radius:999px;padding:10px 8px;box-shadow:var(--shadow-float);display:flex;justify-content:space-around;}
  .legend div{display:flex;align-items:center;gap:6px;}
  .legend span.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .legend span.label{font-family:'Caveat',cursive;font-weight:700;font-size:16px;color:var(--brand-navy);}

  /* ---------- report cards (shared: browse + queue) ---------- */
  .report-card{background:var(--accent-light);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);margin:12px 0;}
  .report-card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .cat-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;border:2px solid #fff;}
  .report-card-title{font-family:'Poppins';font-size:14.5px;font-weight:600;color:#fff;flex:1;line-height:1.35;}
  .status-pill{font-family:'Caveat',cursive;font-size:15px;font-weight:700;padding:4px 14px;border-radius:999px;flex-shrink:0;border:1.5px solid #fff;color:#fff;}
  .status-pill.deadline-soon{background:#b23b3b;border-color:#b23b3b;}
  .report-meta{font-family:'Inter';font-size:12px;color:#fff;opacity:.9;margin-bottom:10px;}
  .raised-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.18);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;}
  .raised-amt{font-family:'Poppins';font-size:20px;font-weight:700;color:#fff;}
  .raised-label{font-family:'Inter';font-size:11px;color:#fff;opacity:.85;text-transform:uppercase;letter-spacing:.04em;}
  .card-btn{width:100%;background:var(--brand-navy);color:#fff;border:none;border-radius:999px;padding:12px;font-family:'Caveat',cursive;font-weight:700;font-size:19px;cursor:pointer;}
  .card-btn.ghost{background:#fff;color:var(--brand-navy);margin-top:8px;}
  .card-btn:disabled{opacity:.6;cursor:not-allowed;}

  .empty-state{text-align:center;padding:60px 24px;color:var(--charcoal);}
  .empty-state svg{margin-bottom:10px;opacity:.5;}

  /* ---------- Queue view ---------- */
  #view-queue{padding:16px;padding-bottom:100px;}
  .section-label{font-family:'Poppins';font-size:16px;font-weight:700;color:var(--brand-navy);margin:6px 0 10px;}

  /* ---------- Resolve sheet ---------- */
  .sheet-overlay{position:absolute;inset:0;background:rgba(51,77,102,.45);z-index:10;display:none;align-items:flex-end;}
  .sheet-overlay.active{display:flex;}
  .sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:88%;overflow-y:auto;padding:10px 20px 28px;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:6px auto 14px;}
  .sheet h3{color:var(--ink);font-size:17px;margin:0 0 14px;text-align:center;}
  textarea, .text-input{width:100%;border:none;border-radius:var(--radius-lg);padding:14px 16px;outline:none;resize:vertical;background:var(--accent-light);color:#fff;font-family:'Inter';}
  textarea::placeholder, .text-input::placeholder{color:rgba(255,255,255,.9);font-family:'Caveat',cursive;font-size:18px;}
  .photo-upload{border:none;border-radius:var(--radius-lg);padding:22px 18px;text-align:center;cursor:pointer;background:var(--accent-light);margin-top:12px;}
  .photo-upload img{max-width:100%;max-height:150px;border-radius:var(--radius-sm);}
  .photo-upload p{font-family:'Caveat',cursive;font-size:16px;font-weight:600;color:#fff;margin:8px 0 0;}
  .primary-btn{width:100%;background:var(--brand-navy);color:#fff;border:none;border-radius:999px;padding:15px;font-family:'Caveat',cursive;font-weight:700;font-size:21px;cursor:pointer;margin-top:18px;}
  .primary-btn:disabled{opacity:.5;cursor:not-allowed;}
  .primary-btn.ghost{background:#fff;color:var(--accent-light);border:1.5px solid var(--accent-light);margin-top:10px;}

  /* ---------- Bottom nav ---------- */
  nav.bottom-nav{position:absolute;left:16px;right:16px;bottom:16px;z-index:6;display:flex;justify-content:space-around;align-items:center;background:var(--accent-light);border-radius:999px;padding:10px 26px calc(10px + env(safe-area-inset-bottom));box-shadow:var(--shadow-float);}
  nav.bottom-nav button{background:none;border:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;cursor:pointer;color:#fff;font-family:'Caveat',cursive;font-weight:700;font-size:17px;}
  nav.bottom-nav button.active{background:var(--brand-mid);}

  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-float);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;white-space:nowrap;}
  .toast.show{opacity:1;bottom:106px;}
  .esri-view .esri-attribution{font-size:9px;}
</style>
</head>

<div id="app-frame">

        <div id="resolution-photo-placeholder">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>

</div>

<script>
(function(){
  "use strict";
  const CFG = window.REALHELP_CONFIG;

  const CATEGORIES = {
    support: { short:"Person", color: "#5580ab", icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5580ab" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' },
    hazard: { short:"Thing", color: "#8f7aa8", icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8f7aa8" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>' },
    safety: { short:"Safety", color: "#e5711f", icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5711f" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/></svg>' }
  };

  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

  let state = {
    org: null,
    openReports: [],
    queueClaims: [],
    view: "browse",
    browseMode: "map",
    mapView: null,
    graphicsLayer: null,
    activeClaimId: null,
    resolutionPhotoFile: null
  };

  function escapeHtml(str){ return (str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function money(n){ return "$" + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove("show"), 2800);
  }
  function daysLeft(deadline){
    return Math.ceil((new Date(deadline) - new Date()) / 86400000);
  }

  // ---------- Auth ----------
  document.getElementById("btn-login").addEventListener("click", async ()=>{
    const email = document.getElementById("in-email").value.trim();
    const password = document.getElementById("in-password").value;
    const errEl = document.getElementById("login-error");
    const btn = document.getElementById("btn-login");
    errEl.textContent = "";
    if(!email || !password){ errEl.textContent = "Enter your email and password."; return; }
    btn.disabled = true; btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = "Sign In";
    if(error){ errEl.textContent = error.message; return; }
    await afterLogin();
  });

  document.getElementById("btn-signout").addEventListener("click", async ()=>{
    await sb.auth.signOut();
    window.location.reload();
  });

  async function afterLogin(){
    const { data: { user } } = await sb.auth.getUser();
    if(!user){ return; }

    const { data: membership, error } = await sb
      .from("organization_members")
      .select("organization_id, organizations(*)")
      .eq("user_id", user.id)
      .limit(1)
      .maybeSingle();

    if(error || !membership){
      document.getElementById("login-error").textContent = "This account isn't linked to a partner organization yet.";
      return;
    }

    state.org = membership.organizations;
    document.getElementById("view-login").classList.add("hidden");
    document.getElementById("org-name-label").textContent = state.org.name;
    initMap();
    await refreshAll();
  }

  // ---------- view switching ----------
  function showView(name){
    state.view = name;
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById("view-"+name).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
    if(name === "browse" && state.mapView){ setTimeout(()=>state.mapView.resize && state.mapView.resize(), 50); }
  }
  document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click", ()=>showView(btn.dataset.view)));

  document.getElementById("toggle-map-btn").addEventListener("click", ()=>{
    state.browseMode = "map";
    document.getElementById("toggle-map-btn").classList.add("active");
    document.getElementById("toggle-list-btn").classList.remove("active");
    document.getElementById("browse-list").classList.remove("active");
  });
  document.getElementById("toggle-list-btn").addEventListener("click", ()=>{
    state.browseMode = "list";
    document.getElementById("toggle-list-btn").classList.add("active");
    document.getElementById("toggle-map-btn").classList.remove("active");
    document.getElementById("browse-list").classList.add("active");
  });

  // ---------- data ----------
  async function refreshAll(){
    if(!state.org) return;
    const [{ data: openReports, error: e1 }, { data: claims, error: e2 }] = await Promise.all([
      sb.rpc("open_reports_for_org", { p_organization_id: state.org.id }),
      sb.from("report_claims")
        .select("*, reports(*)")
        .eq("organization_id", state.org.id)
        .order("created_at", { ascending: false })
    ]);
    if(e1) console.error(e1);
    if(e2) console.error(e2);

    state.openReports = openReports || [];
    state.queueClaims = (claims || []).filter(c => c.status === "claimed");
    const resolvedCount = (claims || []).filter(c => c.status === "resolved").length;

    document.getElementById("stat-open").textContent = state.openReports.length;
    document.getElementById("stat-queue").textContent = state.queueClaims.length;
    document.getElementById("stat-resolved").textContent = resolvedCount;

    renderMapPins();
    renderBrowseList();
    renderQueueList();
  }

  sb.channel("partner-reports-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"reports" }, ()=>{ if(state.org) refreshAll(); })
    .on("postgres_changes", { event:"*", schema:"public", table:"report_claims" }, ()=>{ if(state.org) refreshAll(); })
    .subscribe();

  // ---------- ArcGIS map ----------
  function initMap(){
    require(["esri/config","esri/Map","esri/views/MapView","esri/layers/GraphicsLayer"],
    function(esriConfig, Map, MapView, GraphicsLayer){
      esriConfig.apiKey = CFG.ARCGIS_API_KEY;
      const graphicsLayer = new GraphicsLayer();
      const map = new Map({ basemap: "arcgis/light-gray", layers:[graphicsLayer] });
      const center = (state.org.center_lat && state.org.center_lng) ? [state.org.center_lng, state.org.center_lat] : CFG.DEFAULT_CENTER;
      const view = new MapView({ container:"map-el", map:map, center:center, zoom:CFG.DEFAULT_ZOOM, ui:{ components:["attribution"] } });
      state.mapView = view; state.graphicsLayer = graphicsLayer;
      view.when(()=>renderMapPins());
      view.on("click", (evt)=>{
        view.hitTest(evt).then(res=>{
          const hit = res.results.find(r=>r.graphic && r.graphic.attributes && r.graphic.attributes.reportId);
          if(hit){
            document.getElementById("toggle-list-btn").click();
            const card = document.querySelector(`[data-report-id="${hit.graphic.attributes.reportId}"]`);
            if(card) card.scrollIntoView({ behavior:"smooth", block:"center" });
          }
        });
      });
    });
  }

  function renderMapPins(){
    if(!state.graphicsLayer) return;
    state.graphicsLayer.removeAll();
    state.openReports.forEach(r=>{
      const cat = CATEGORIES[r.category] || CATEGORIES.support;
      state.graphicsLayer.add({
        geometry:{ type:"point", longitude:r.lng, latitude:r.lat },
        symbol:{ type:"simple-marker", color:cat.color, size:13, outline:{ color:"#ffffff", width:2 } },
        attributes:{ reportId:r.id }
      });
    });
  }

  // ---------- browse list ----------
  function renderBrowseList(){
    const wrap = document.getElementById("browse-list");
    if(state.openReports.length === 0){
      wrap.innerHTML = `<div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a7b0b8" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <p>No open reports match your service types and area right now.</p>
      </div>`;
      return;
    }
    wrap.innerHTML = state.openReports.map(r=>{
      const cat = CATEGORIES[r.category] || CATEGORIES.support;
      return `
      <div class="report-card" data-report-id="${r.id}">
        <div class="report-card-top">
          <div class="cat-badge">${cat.icon}</div>
          <div class="report-card-title">${escapeHtml(r.description).slice(0,110)}</div>
        </div>
        <div class="report-meta">${r.address ? escapeHtml(r.address) + " · " : ""}${new Date(r.created_at).toLocaleDateString()}</div>
        <div class="raised-row">
          <div><div class="raised-amt">${money(r.raised_amount)}</div><div class="raised-label">raised so far</div></div>
          <div style="text-align:right;"><div class="raised-amt">${money(r.goal_amount)}</div><div class="raised-label">goal</div></div>
        </div>
        <button class="card-btn" data-claim-report="${r.id}">Claim This Report</button>
      </div>`;
    }).join("");

    wrap.querySelectorAll("[data-claim-report]").forEach(btn=>{
      btn.addEventListener("click", ()=>claimReport(btn.dataset.claimReport, btn));
    });
  }

  async function claimReport(reportId, btnEl){
    btnEl.disabled = true; btnEl.textContent = "Claiming…";
    const { error } = await sb.rpc("claim_report", { p_report_id: reportId, p_organization_id: state.org.id });
    if(error){
      toast(error.message.includes("not open") ? "Another organization just claimed this report." : "Couldn't claim this report — try again.");
      btnEl.disabled = false; btnEl.textContent = "Claim This Report";
      await refreshAll();
      return;
    }
    toast("Report claimed — find it in your Queue.");
    await refreshAll();
  }

  // ---------- queue list ----------
  function renderQueueList(){
    const wrap = document.getElementById("queue-list");
    if(state.queueClaims.length === 0){
      wrap.innerHTML = `<div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a7b0b8" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <p>Nothing in your queue yet — claim a report from Browse to get started.</p>
      </div>`;
      return;
    }
    wrap.innerHTML = state.queueClaims.map(c=>{
      const r = c.reports;
      const cat = CATEGORIES[r.category] || CATEGORIES.support;
      const dLeft = daysLeft(c.claim_deadline);
      const soon = dLeft <= 3;
      return `
      <div class="report-card">
        <div class="report-card-top">
          <div class="cat-badge">${cat.icon}</div>
          <div class="report-card-title">${escapeHtml(r.description).slice(0,110)}</div>
          <div class="status-pill ${soon ? 'deadline-soon' : ''}">${dLeft > 0 ? dLeft + 'd left' : 'overdue'}</div>
        </div>
        <div class="report-meta">${r.address ? escapeHtml(r.address) + " · " : ""}claimed ${new Date(c.created_at).toLocaleDateString()}</div>
        <div class="raised-row">
          <div><div class="raised-amt">${money(r.raised_amount)}</div><div class="raised-label">raised</div></div>
          <div style="text-align:right;"><div class="raised-amt">50%</div><div class="raised-label">your share on resolution</div></div>
        </div>
        <button class="card-btn" data-resolve-claim="${c.id}">Mark Resolved</button>
      </div>`;
    }).join("");

    wrap.querySelectorAll("[data-resolve-claim]").forEach(btn=>{
      btn.addEventListener("click", ()=>openResolveSheet(btn.dataset.resolveClaim));
    });
  }

  // ---------- resolve sheet ----------
  function openResolveSheet(claimId){
    state.activeClaimId = claimId;
    state.resolutionPhotoFile = null;
    document.getElementById("in-resolution-notes").value = "";
    document.getElementById("resolution-photo-placeholder").style.display = "block";
    document.getElementById("resolution-photo-preview").style.display = "none";
    document.getElementById("in-resolution-photo").value = "";
    document.getElementById("btn-submit-resolution").disabled = true;
    document.getElementById("sheet-overlay").classList.add("active");
  }
  document.getElementById("btn-cancel-resolution").addEventListener("click", ()=>{
    document.getElementById("sheet-overlay").classList.remove("active");
  });
  document.getElementById("in-resolution-notes").addEventListener("input", validateResolution);
  function validateResolution(){
    const notes = document.getElementById("in-resolution-notes").value.trim();
    document.getElementById("btn-submit-resolution").disabled = notes.length < 4;
  }
  document.getElementById("resolution-photo-zone").addEventListener("click", ()=>document.getElementById("in-resolution-photo").click());
  document.getElementById("in-resolution-photo").addEventListener("change", (e)=>{
    const file = e.target.files[0]; if(!file) return;
    state.resolutionPhotoFile = file;
    const reader = new FileReader();
    reader.onload = ev=>{
      document.getElementById("resolution-photo-placeholder").style.display = "none";
      const img = document.getElementById("resolution-photo-preview");
      img.src = ev.target.result; img.style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("btn-submit-resolution").addEventListener("click", async ()=>{
    const btn = document.getElementById("btn-submit-resolution");
    btn.disabled = true; btn.textContent = "Submitting…";
    try{
      let resolution_photo_url = null;
      if(state.resolutionPhotoFile){
        const ext = (state.resolutionPhotoFile.name.split(".").pop() || "jpg").toLowerCase();
        const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
        const { error: upErr } = await sb.storage.from("resolution-photos").upload(path, state.resolutionPhotoFile);
        if(upErr) throw upErr;
        resolution_photo_url = sb.storage.from("resolution-photos").getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from("report_claims").update({
        resolution_notes: document.getElementById("in-resolution-notes").value.trim(),
        resolution_photo_url,
        resolved_at: new Date().toISOString(),
        status: "resolved"
      }).eq("id", state.activeClaimId);
      if(error) throw error;

      document.getElementById("sheet-overlay").classList.remove("active");
      toast("Submitted for review — you'll be notified once approved.");
      await refreshAll();
    }catch(err){
      console.error(err);
      toast("Couldn't submit — please try again.");
    }finally{
      btn.disabled = false; btn.textContent = "Submit for Review";
    }
  });

  // ---------- boot ----------
  (async function boot(){
    const { data: { session } } = await sb.auth.getSession();
    if(session){ await afterLogin(); }
  })();

})();
</script>
</body>
</html>
