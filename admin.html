<meta name="theme-color" content="#93c4d3">

<style>
  :root{
    --ink:#334d66; --charcoal:#595757; --accent-light:#93c4d3; --brand-navy:#215f9a; --brand-mid:#7ab6c8;
    --support:#5580ab; --hazard:#8f7aa8; --safety:#e5711f; --surface-alt:#f6f7f8; --border:#e4e7ea;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(51,77,102,.06), 0 8px 24px -12px rgba(51,77,102,.18);
    --shadow-float:0 10px 30px -8px rgba(51,77,102,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--charcoal);background:#dfe7ec;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Poppins',system-ui,sans-serif;}
  button{font-family:inherit;}
  input,textarea{font-family:inherit;font-size:16px;}

  #app-frame{max-width:560px;margin:0 auto;min-height:100vh;background:var(--surface-alt);position:relative;display:flex;flex-direction:column;overflow:hidden;}
  @media (min-width:640px){
    body{display:flex;justify-content:center;padding:28px 0;}
    #app-frame{min-height:calc(100vh - 56px);border-radius:32px;box-shadow:var(--shadow-float);border:1px solid rgba(51,77,102,.08);}
  }

  #view-login{position:absolute;inset:0;z-index:40;background:var(--accent-light);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center;}
  #view-login.hidden{display:none;}
  #view-login img{width:min(70%,260px);margin-bottom:8px;}
  #view-login .tagline{font-family:'Caveat',cursive;font-weight:700;font-size:22px;color:var(--brand-navy);margin-bottom:30px;}
  #view-login input{width:100%;border:none;border-radius:999px;padding:14px 18px;margin-bottom:12px;background:rgba(255,255,255,.9);color:var(--ink);}
  #view-login input::placeholder{color:var(--charcoal);}
  #login-error{color:#b23b3b;font-size:13px;min-height:18px;}
  .login-btn{width:100%;background:var(--brand-navy);color:#fff;border:none;border-radius:999px;padding:14px;font-family:'Caveat',cursive;font-weight:700;font-size:21px;cursor:pointer;margin-top:8px;}
  .login-btn:disabled{opacity:.6;}

  header{background:var(--accent-light);padding:20px 18px 16px;flex-shrink:0;text-align:center;position:relative;}
  .brand-row{display:flex;align-items:center;justify-content:center;position:relative;}
  .brand-row img{height:44px;}
  .signout-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;}
  .stat-row{display:flex;justify-content:center;gap:30px;margin-top:8px;}
  .stat-row .stat-num{font-family:'Caveat',cursive;font-weight:700;font-size:28px;color:var(--brand-navy);}
  .stat-row .stat-label{font-family:'Caveat',cursive;font-weight:700;font-size:17px;color:var(--brand-navy);}

  main{flex:1;overflow-y:auto;padding:18px;padding-bottom:40px;}

  .review-card{background:var(--accent-light);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-card);margin-bottom:16px;}
  .review-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .cat-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;border:2px solid #fff;}
  .review-title{font-family:'Poppins';font-size:15px;font-weight:600;color:#fff;flex:1;line-height:1.35;}
  .org-tag{font-family:'Caveat',cursive;font-weight:700;font-size:16px;color:#fff;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:999px;}
  .review-meta{font-family:'Inter';font-size:12px;color:#fff;opacity:.9;margin-bottom:12px;}
  .review-section{background:rgba(255,255,255,.18);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;}
  .review-section-label{font-family:'Caveat',cursive;font-weight:700;font-size:16px;color:#fff;margin-bottom:4px;}
  .review-section-body{font-family:'Inter';font-size:13.5px;color:#fff;line-height:1.5;}
  .review-photo{width:100%;max-height:220px;object-fit:cover;border-radius:var(--radius-sm);margin-top:8px;}
  .raised-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.18);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;}
  .raised-amt{font-family:'Poppins';font-size:19px;font-weight:700;color:#fff;}
  .raised-label{font-family:'Inter';font-size:11px;color:#fff;opacity:.85;text-transform:uppercase;letter-spacing:.04em;}
  .review-actions{display:flex;gap:10px;}
  .review-actions button{flex:1;border:none;border-radius:999px;padding:12px;font-family:'Caveat',cursive;font-weight:700;font-size:19px;cursor:pointer;}
  .btn-approve{background:var(--brand-navy);color:#fff;}
  .btn-reject{background:#fff;color:#b23b3b;}
  .review-actions button:disabled{opacity:.5;cursor:not-allowed;}

  .empty-state{text-align:center;padding:70px 24px;color:var(--charcoal);}
  .empty-state svg{margin-bottom:10px;opacity:.5;}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-float);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
  .toast.show{opacity:1;}

  /* =====================================================================
     Keyboard focus, hover, reduced motion
     ===================================================================== */
  button:focus-visible{outline:3px solid var(--brand-navy);outline-offset:2px;}
  header button:focus-visible{outline-color:#fff;}
  @media (hover:hover){
    .btn-approve:hover,.btn-reject:hover,.login-btn:hover{filter:brightness(1.08);}
  }
  @media (prefers-reduced-motion:reduce){ .toast{transition:none;} }

  /* =====================================================================
     TABLET / DESKTOP (>=768px): wide header, review cards as a grid
     ===================================================================== */
  @media (min-width:768px){
    body{padding:0;}
    #app-frame{
      max-width:none;width:100%;margin:0;
      min-height:100vh;border-radius:0;border:none;box-shadow:none;
    }
    header{padding:24px 32px 20px;text-align:left;}
    .brand-row{justify-content:flex-start;gap:16px;}
    .brand-row img{height:52px;}
    .signout-btn{position:absolute;right:32px;}
    .stat-row{justify-content:flex-start;margin-top:14px;gap:16px;}
    .stat-row > div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.35);border-radius:var(--radius-md);padding:8px 18px;}
    .stat-row .stat-num{font-size:30px;}
    .stat-row .stat-label{font-size:17px;}

    main{
      padding:28px 32px 48px;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
      gap:20px;
      align-content:start;
    }
    .review-card{margin-bottom:0;}
    .empty-state{grid-column:1 / -1;}
    .review-top{flex-wrap:wrap;}
    .review-title{min-width:180px;}
    .org-tag{white-space:nowrap;}

    #view-login img{width:280px;}
    #view-login input,.login-btn{max-width:400px;}
  }

  /* =====================================================================
     WIDE DESKTOP (>=1400px): cap columns so cards don't get too sparse
     ===================================================================== */
  @media (min-width:1400px){
    main{grid-template-columns:repeat(3,minmax(380px,440px));justify-content:start;}
  }
</style>
</head>

      <button class="signout-btn" id="btn-signout" title="Sign out" aria-label="Sign out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#215f9a" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>

      <div><div class="stat-num" id="stat-pending">–</div><div class="stat-label">Pending Review</div></div>
    </div>
  </header>

  <main id="review-list"></main>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";
  const CFG = window.REALHELP_CONFIG;

  const CATEGORIES = {
    support: { color: "#5580ab", icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5580ab" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' },
    hazard: { color: "#8f7aa8", icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8f7aa8" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>' },
    safety: { color: "#e5711f", icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5711f" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/></svg>' }
  };

  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  let isAdmin = false;

  function escapeHtml(str){ return (str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function money(n){ return "$" + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove("show"), 2800);
  }

  document.getElementById("btn-login").addEventListener("click", async ()=>{
    const email = document.getElementById("in-email").value.trim();
    const password = document.getElementById("in-password").value;
    const errEl = document.getElementById("login-error");
    const btn = document.getElementById("btn-login");
    errEl.textContent = "";
    if(!email || !password){ errEl.textContent = "Enter your email and password."; return; }
    btn.disabled = true; btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = "Sign In";
    if(error){ errEl.textContent = error.message; return; }
    await afterLogin();
  });

  ["in-email","in-password"].forEach(id=>{
    document.getElementById(id).addEventListener("keydown", e=>{
      if(e.key === "Enter") document.getElementById("btn-login").click();
    });
  });

  document.getElementById("btn-signout").addEventListener("click", async ()=>{
    await sb.auth.signOut();
    window.location.reload();
  });

  async function afterLogin(){
    const { data: { user } } = await sb.auth.getUser();
    if(!user) return;

    const { data: adminRow } = await sb.from("platform_admins").select("user_id").eq("user_id", user.id).maybeSingle();
    if(!adminRow){
      document.getElementById("login-error").textContent = "This account isn't authorized for admin review.";
      await sb.auth.signOut();
      return;
    }
    isAdmin = true;
    document.getElementById("view-login").classList.add("hidden");
    await refresh();
  }

  async function refresh(){
    const { data, error } = await sb.from("pending_claim_reviews").select("*");
    if(error){ console.error(error); toast("Couldn't load pending reviews."); return; }
    document.getElementById("stat-pending").textContent = (data || []).length;
    renderList(data || []);
  }

  sb.channel("admin-claims-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"report_claims" }, ()=>{ if(isAdmin) refresh(); })
    .subscribe();

  function renderList(items){
    const wrap = document.getElementById("review-list");
    if(items.length === 0){
      wrap.innerHTML = `<div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a7b0b8" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <p>Nothing waiting on review right now.</p>
      </div>`;
      return;
    }
    wrap.innerHTML = items.map(item=>{
      const cat = CATEGORIES[item.category] || CATEGORIES.support;
      const payout = (Number(item.raised_amount) * 0.95).toFixed(2);
      return `
      <div class="review-card" data-claim-id="${item.claim_id}">
        <div class="review-top">
          <div class="cat-badge">${cat.icon}</div>
          <div class="review-title">${escapeHtml(item.description).slice(0,120)}</div>
          <div class="org-tag">${escapeHtml(item.organization_name)}</div>
        </div>
        <div class="review-meta">${item.address ? escapeHtml(item.address) + " · " : ""}resolved ${new Date(item.resolved_at).toLocaleDateString()}</div>

        <div class="review-section">
          <div class="review-section-label">Resolution notes</div>
          <div class="review-section-body">${escapeHtml(item.resolution_notes || "(none provided)")}</div>
          ${item.resolution_photo_url ? `<img class="review-photo" src="${item.resolution_photo_url}">` : ""}
        </div>

        <div class="raised-row">
          <div><div class="raised-amt">${money(item.raised_amount)}</div><div class="raised-label">total raised</div></div>
          <div style="text-align:right;"><div class="raised-amt">${money(payout)}</div><div class="raised-label">payout if approved (95%)</div></div>
        </div>

        <div class="review-actions">
          <button class="btn-approve" data-decision="approved">Approve Payout</button>
          <button class="btn-reject" data-decision="rejected">Send Back</button>
        </div>
      </div>`;
    }).join("");

    wrap.querySelectorAll(".review-card").forEach(card=>{
      const claimId = card.dataset.claimId;
      card.querySelectorAll("button[data-decision]").forEach(btn=>{
        btn.addEventListener("click", ()=>decide(claimId, btn.dataset.decision, card));
      });
    });
  }

  async function decide(claimId, decision, cardEl){
    const buttons = cardEl.querySelectorAll("button");
    buttons.forEach(b=>b.disabled = true);
    const { error } = await sb.rpc("review_claim", { p_claim_id: claimId, p_decision: decision });
    if(error){
      toast("Couldn't submit review — try again.");
      buttons.forEach(b=>b.disabled = false);
      return;
    }
    toast(decision === "approved" ? "Approved — payout queued." : "Sent back to the organization.");
    await refresh();
  }

  (async function boot(){
    const { data: { session } } = await sb.auth.getSession();
    if(session){ await afterLogin(); }
  })();
})();
</script>
</body>
</html>
